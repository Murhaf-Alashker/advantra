<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reverb WebSocket Test</title>
</head>
<body>
<h2>Laravel Reverb WebSocket Test</h2>
<script>
    const socket = new WebSocket("ws://127.0.0.1:8080/app/qjuam0jspmbzmknkas2u?protocol=7&client=js&version=1.0&flash=false");

    socket.onopen = () => {
        console.log("✅ Connected to Reverb WebSocket");
        socket.send(JSON.stringify({
            event: "pusher:subscribe",
            data: {
                channel: "chat.1"
            }
        }));
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("📩 Event:", data.event);
        console.log("📦 Payload:", data.data);
    };


    socket.onerror = (error) => {
        console.error("❌ WebSocket error:", error);
    };

    socket.onclose = () => {
        console.warn("🔌 WebSocket connection closed");
    };
</script>
</body>
</html>
